<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест слайдер + админка</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial; 
            background: linear-gradient(135deg, #ff9a9e, #fecfef); 
            min-height: 100vh;
        }
        .slider { 
            height: 60vh; 
            max-width: 800px; 
            margin: 20px auto; 
            position: relative; 
            border-radius: 20px; 
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .slide { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            opacity: 0; 
            transition: opacity 1s;
        }
        .slide.active { opacity: 1; }
        .slide img { width: 100%; height: 100%; object-fit: cover; }
        
        .admin { 
            max-width: 800px; 
            margin: 0 auto 20px; 
            padding: 20px; 
            background: white; 
            border-radius: 15px; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        #drop { 
            border: 4px dashed #ff6b9d; 
            padding: 40px; 
            text-align: center; 
            cursor: pointer; 
            border-radius: 10px;
        }
        #drop.drag { border-color: #ff1493; background: #fff0f5; }
        .photos { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; }
        .photo { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; cursor: pointer; }
        button { background: #ff6b9d; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="slider" id="slider"></div>
    
    <div class="admin">
        <h2>➕ Загрузить фото</h2>
        <div id="drop">📁 Перетащи сюда или кликни</div>
        <div class="photos" id="photos"></div>
    </div>

    <script>
        let photos = JSON.parse(localStorage.getItem('dashaPhotos') || '[]');
        let currentSlide = 0;

        function save() {
            localStorage.setItem('dashaPhotos', JSON.stringify(photos));
            updateSlider();
            updatePhotos();
        }

        function updateSlider() {
            const slider = document.getElementById('slider');
            slider.innerHTML = '';
            photos.forEach((photo, i) => {
                const slide = document.createElement('div');
                slide.className = 'slide';
                slide.innerHTML = `<img src="${photo}" alt="Фото ${i+1}">`;
                if (i === currentSlide) slide.classList.add('active');
                slider.appendChild(slide);
            });
        }

        function updatePhotos() {
            document.getElementById('photos').innerHTML = 
                photos.map((photo, i) => 
                    `<img class="photo" src="${photo}" onclick="currentSlide=${i};updateSlider()">
                     <br><button onclick="photos.splice(${i},1);save()">Удалить</button>`
                ).join('');
        }

        // Drag & Drop
        const drop = document.getElementById('drop');
        drop.onclick = () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = e => {
                [...e.target.files].forEach(file => {
                    const reader = new FileReader();
                    reader.onload = ev => {
                        photos.unshift(ev.target.result);
                        save();
                    };
                    reader.readAsDataURL(file);
                });
            };
            input.click();
        };

        ['dragover', 'dragenter'].forEach(ev => 
            drop.addEventListener(ev, e => {
                e.preventDefault();
                drop.classList.add('drag');
            })
        );

        ['dragleave', 'drop'].forEach(ev => 
            drop.addEventListener(ev, e => {
                e.preventDefault();
                drop.classList.remove('drag');
                if (ev === 'drop') {
                    [...e.dataTransfer.files].forEach(file => {
                        if (file.type.startsWith('image/')) {
                            const reader = new FileReader();
                            reader.onload = ev => {
                                photos.unshift(ev.target.result);
                                save();
                            };
                            reader.readAsDataURL(file);
                        }
                    });
                }
            })
        );

        updateSlider();
        updatePhotos();
    </script>
</body>
</html>
