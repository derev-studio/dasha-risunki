backend:
  name: github
  repo: art-vision-studio/dasha-risunki
  branch: main
  auth_type: oauth

media_folder: "images"
public_folder: "/images"

collections:
  - name: "gallery"
    label: "🖼️ Галерея Даши"
    folder: "data"
    create: true
    delete: true
    fields:
      - {label: "Название", name: "title", widget: "string", required: true}
      - {label: "Описание", name: "description", widget: "text"}
      - {label: "Цена (₽)", name: "price", widget: "number", value: 1000, required: true}
      - {label: "Картинка", name: "image", widget: "image", required: true, allow_multiple: false}
