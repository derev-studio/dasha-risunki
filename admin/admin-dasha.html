<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 Галерея Даши</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Arial', sans-serif; 
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%); 
            min-height: 100vh; 
            overflow-x: hidden;
        }
        
        /* === ГЛАВНЫЙ СЛАЙДЕР (МЯГКИЙ ПЕРЕХОД) === */
        .slider-container {
            position: relative;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .slider {
            width: 100%;
            height: 100%;
            position: relative;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transform: translateX(100%);
            transition: all 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: 1;
        }
        .slide.active {
            opacity: 1;
            transform: translateX(0);
            z-index: 2;
        }
        .slide.prev {
            transform: translateX(-100%);
            z-index: 1;
        }
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .slider-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.9);
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 10;
        }
        .slider-nav:hover { 
            background: white; 
            transform: translateY(-50%) scale(1.1); 
        }
        .prev { left: 20px; }
        .next { right: 20px; }
        .dots {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }
        .dot {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            cursor: pointer;
            transition: all 0.3s;
        }
        .dot.active { 
            background: #ff6b9d; 
            transform: scale(1.3); 
        }

        /* === АДМИНКА === */
        .admin-panel {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .admin-section {
            background: rgba(255,255,255,0.95);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            min-width: 350px;
            flex: 1;
        }
        .admin-section h2 {
            text-align: center;
            color: #ff6b9d;
            margin-bottom: 25px;
            font-size: 1.8em;
        }
        .upload-zone {
            border: 4px dashed #ff9a9e;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(45deg, #fff5f7, #ffeef2);
        }
        .upload-zone:hover, .upload-zone.dragover {
            border-color: #ff6b9d;
            background: linear-gradient(45deg, #fff, #ffeef2);
            transform: scale(1.02);
        }
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        .photo-item {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }
        .photo-item:hover { transform: translateY(-5px); }
        .photo-item img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }
        .delete-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #ff4757;
            color: white;
            border: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            display: none;
        }
        .photo-item:hover .delete-btn { display: block; }
        .stats {
            text-align: center;
            background: linear-gradient(45deg, #ff9a9e, #ff6b9d);
            color: white;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            font-size: 1.2em;
            font-weight: bold;
        }
        .success {
            position: fixed;
            top: 30px;
            right: 30px;
            background: linear-gradient(45deg, #2ed573, #1abc9c);
            color: white;
            padding: 20px 30px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 1000;
            animation: slideIn 0.5s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toggle-admin {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(45deg, #ff6b9d, #ff9a9e);
            color: white;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.3s;
            z-index: 999;
        }
        .toggle-admin:hover { transform: scale(1.1); }
        .admin-hidden { 
            opacity: 0; 
            max-height: 0; 
            overflow: hidden; 
            transition: all 0.5s; 
        }
        .admin-visible { 
            opacity: 1; 
            max-height: 1200px; 
        }

        /* Адаптив */
        @media (max-width: 768px) {
            .slider-container { height: 50vh; padding: 10px; }
            .admin-panel { flex-direction: column; gap: 20px; }
            .admin-section { min-width: 100%; }
        }
    </style>
</head>
<body>
    <!-- Главный слайдер -->
    <div class="slider-container">
        <div class="slider" id="slider"></div>
        <button class="slider-nav prev" id="prevBtn">❮</button>
        <button class="slider-nav next" id="nextBtn">❯</button>
        <div class="dots" id="dots"></div>
    </div>

    <!-- Кнопка админки -->
    <button class="toggle-admin" id="toggleAdmin">⚙️</button>

    <!-- Админ панель -->
    <div class="admin-panel admin-hidden" id="adminPanel">
        <div class="admin-section">
            <h2>➕ Добавить фото</h2>
            <div class="stats" id="uploadStats">Фото: 0</div>
            <div class="upload-zone" id="uploadZone">
                <h3>📁 Перетащи сюда или кликни</h3>
                <p>JPG, PNG, WEBP — до 10MB</p>
            </div>
        </div>
        
        <div class="admin-section">
            <h2>📸 Все фото</h2>
            <div class="stats" id="galleryStats">Всего: 0</div>
            <div class="photo-grid" id="photoGrid"></div>
        </div>
    </div>

    <script>
        let photos = JSON.parse(localStorage.getItem('dashaPhotos')) || [];
        let currentSlide = 0;
        let slideInterval;

        function init() {
            renderSlider();
            renderAdmin();
            startSlider();
            setupEventListeners();
        }

        function renderSlider() {
            const slider = document.getElementById('slider');
            const dots = document.getElementById('dots');
            
            slider.innerHTML = '';
            dots.innerHTML = '';
            
            photos.forEach((photo, index) => {
                const slide = document.createElement('div');
                slide.className = 'slide';
                slide.innerHTML = `<img src="${photo}" alt="Фото ${index + 1}">`;
                slider.appendChild(slide);
                
                const dot = document.createElement('div');
                dot.className = 'dot';
                dot.onclick = () => goToSlide(index);
                dots.appendChild(dot);
            });
            
            if (photos.length > 0) {
                showSlide(0);
            }
        }

        function showSlide(index) {
            document.querySelectorAll('.slide').forEach((slide, i) => {
                slide.classList.remove('active', 'prev');
                if (i === index) {
                    slide.classList.add('active');
                } else if (i === currentSlide) {
                    slide.classList.add('prev');
                }
            });
            
            document.querySelectorAll('.dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });
            currentSlide = index;
        }

        function goToSlide(index) {
            showSlide(index);
            clearInterval(slideInterval);
            startSlider();
        }

        function nextSlide() {
            const next = (currentSlide + 1) % photos.length;
            showSlide(next);
        }

        function prevSlide() {
            const prev = currentSlide === 0 ? photos.length - 1 : currentSlide - 1;
            showSlide(prev);
        }

        function startSlider() {
            if (photos.length > 1) {
                slideInterval = setInterval(nextSlide, 5000);
            }
        }

        function renderAdmin() {
            document.getElementById('uploadStats').textContent = `Фото: ${photos.length}`;
            document.getElementById('galleryStats').textContent = `Всего: ${photos.length}`;
            
            const grid = document.getElementById('photoGrid');
            grid.innerHTML = '';
            
            photos.forEach((photo, index) => {
                const item = document.createElement('div');
                item.className = 'photo-item';
                item.innerHTML = `
                    <img src="${photo}" alt="Фото ${index + 1}">
                    <button class="delete-btn" onclick="deletePhoto(${index})">×</button>
                `;
                grid.appendChild(item);
            });
        }

        function deletePhoto(index) {
            photos.splice(index, 1);
            localStorage.setItem('dashaPhotos', JSON.stringify(photos));
            renderSlider();
            renderAdmin();
            showSuccess('Фото удалено!');
        }

        function addPhoto(photo) {
            photos.unshift(photo);
            localStorage.setItem('dashaPhotos', JSON.stringify(photos));
            renderSlider();
            renderAdmin();
            showSuccess('Фото добавлено!');
        }

        function showSuccess(message) {
            const success = document.createElement('div');
            success.className = 'success';
            success.textContent = message;
            document.body.appendChild(success);
            setTimeout(() => success.remove(), 3000);
        }

        function setupEventListeners() {
            document.getElementById('nextBtn').onclick = nextSlide;
            document.getElementById('prevBtn').onclick = prevSlide;
            
            document.getElementById('toggleAdmin').onclick = () => {
                const admin = document.getElementById('adminPanel');
                admin.classList.toggle('admin-hidden');
                admin.classList.toggle('admin-visible');
            };

            const uploadZone = document.getElementById('uploadZone');
            
            uploadZone.onclick = () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.onchange = e => handleFiles(e.target.files);
                input.click();
            };

            ['dragover', 'dragenter'].forEach(event => {
                uploadZone.addEventListener(event, e => {
                    e.preventDefault();
                    uploadZone.classList.add('dragover');
                });
            });

            ['dragleave', 'drop'].forEach(event => {
                uploadZone.addEventListener(event, e => {
                    e.preventDefault();
                    uploadZone.classList.remove('dragover');
                    if (event === 'drop') handleFiles(e.dataTransfer.files);
                });
            });
        }

        function handleFiles(files) {
            Array.from(files).forEach(file => {
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = e => addPhoto(e.target.result);
                    reader.readAsDataURL(file);
                }
            });
        }

        init();
    </script>
</body>
</html>
