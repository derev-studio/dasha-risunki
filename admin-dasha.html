<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка Даши 🌸</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(45deg, #ff6b9d, #c44569);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            opacity: 0.9;
            font-size: 1.2em;
        }

        .content {
            padding: 40px;
        }

        .form-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #c44569;
            font-size: 1.1em;
        }

        input, textarea, select {
            width: 100%;
            padding: 15px;
            border: 2px solid #ffe4e6;
            border-radius: 15px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #fff;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #ff6b9d;
            box-shadow: 0 0 20px rgba(255, 107, 157, 0.3);
            transform: translateY(-2px);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            background: linear-gradient(45deg, #ff6b9d, #c44569);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.2em;
            font-weight: 600;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(255, 107, 157, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(255, 107, 157, 0.6);
        }

        .btn:active {
            transform: translateY(-2px);
        }

        .gallery-preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .gallery-item {
            background: white;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-10px);
        }

        .gallery-item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .gallery-item h4 {
            color: #c44569;
            font-size: 1em;
            margin-bottom: 5px;
        }

        .status {
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            font-weight: 600;
            text-align: center;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        @media (max-width: 768px) {
            .content {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌸 Админка Даши 🌸</h1>
            <p>Управляй галереей одним кликом!</p>
        </div>

        <div class="content">
            <div class="form-section">
                <h2 style="color: #c44569; margin-bottom: 25px; font-size: 1.8em;">➕ Добавить товар</h2>
                
                <form id="productForm">
                    <div class="form-group">
                        <label for="title">Название товара:</label>
                        <input type="text" id="title" placeholder="Например: Розовое платье" required>
                    </div>

                    <div class="form-group">
                        <label for="description">Описание:</label>
                        <textarea id="description" placeholder="Краткое описание товара..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="price">Цена (₽):</label>
                        <input type="number" id="price" placeholder="1000" min="0" step="0.01" required>
                    </div>

                    <div style="display: flex; gap: 15px; justify-content: center;">
                        <button type="submit" class="btn">💖 СОХРАНИТЬ</button>
                        <button type="button" class="btn" onclick="loadGallery()" style="background: linear-gradient(45deg, #6b7280, #4b5563);">🔄 Обновить</button>
                    </div>
                </form>

                <div id="status" class="status" style="display: none;"></div>
            </div>

            <div class="form-section">
                <h2 style="color: #c44569; margin-bottom: 25px; font-size: 1.8em;">👀 Текущая галерея</h2>
                <div id="galleryPreview" class="gallery-preview"></div>
            </div>
        </div>
    </div>

    <script>
        let gallery = [];

        // Загрузка галереи при старте
        async function loadGallery() {
            try {
                const response = await fetch('/gallery.json');
                gallery = await response.json();
                displayGallery();
                showStatus('Галерея загружена!', 'success');
            } catch (error) {
                showStatus('gallery.json не найден', 'error');
                gallery = [];
            }
        }

        // Отображение галереи
        function displayGallery() {
            const container = document.getElementById('galleryPreview');
            container.innerHTML = '';

            gallery.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'gallery-item';
                div.innerHTML = `
                    <img src="${item.image}" alt="${item.title}" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjE1MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjZjBmMGYwIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNCIgZmlsbD0iI2ZmZiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSI+Изображение</R0VudD48L3N2Zz4='">
                    <h4>${item.title}</h4>
                    <p>${item.description}</p>
                    <strong>${item.price}₽</strong>
                    <br><small>ID: ${index}</small>
                `;
                container.appendChild(div);
            });
        }

        // Показ статуса
        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
            setTimeout(() => {
                status.style.display = 'none';
            }, 3000);
        }

        // Сохранение товара
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const newProduct = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                price: parseFloat(document.getElementById('price').value),
                image: gallery.length > 0 ? gallery[0].image : 'images/default.jpg' // Берет первую картинку
            };

            try {
                // Загружаем текущую галерею
                const response = await fetch('/gallery.json');
                gallery = await response.json();
            } catch (error) {
                gallery = [];
            }

            // Добавляем новый товар
            gallery.unshift(newProduct);

            // Сохраняем обратно
            const saveResponse = await fetch('/gallery.json', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(gallery, null, 2)
            });

            if (saveResponse.ok) {
                document.getElementById('productForm').reset();
                displayGallery();
                showStatus('✅ Товар сохранен в gallery.json!', 'success');
            } else {
                showStatus('❌ Ошибка сохранения', 'error');
            }
        });

        // Загружаем галерею при загрузке страницы
        loadGallery();
    </script>
</body>
</html>
