<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 Админка Даши</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)),
                        url('https://images.unsplash.com/photo-1584323416072-093acbc5b3ce?w=1920&h=1080&fit=crop&auto=format') center/cover no-repeat fixed;
            min-height: 100vh; padding: 20px;
        }
        .container {
            max-width: 1000px; margin: 0 auto;
            background: rgba(255,255,255,0.95); border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3); overflow: hidden;
        }
        .header {
            background: linear-gradient(45deg, #ff6b9d, #c44569);
            color: white; padding: 30px; text-align: center;
        }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .content { padding: 40px; }
        .form-section {
            background: white; border-radius: 20px; padding: 30px;
            margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .form-group { margin-bottom: 25px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #c44569; }
        input, textarea, select {
            width: 100%; padding: 15px; border: 2px solid #ffe4e6;
            border-radius: 15px; font-size: 16px; transition: all 0.3s;
        }
        input:focus, textarea:focus { 
            outline: none; border-color: #ff6b9d; 
            box-shadow: 0 0 20px rgba(255,107,157,0.3);
        }
        .btn {
            background: linear-gradient(45deg, #ff6b9d, #c44569);
            color: white; border: none; padding: 18px 40px;
            font-size: 1.2em; border-radius: 25px; cursor: pointer;
            box-shadow: 0 8px 25px rgba(255,107,157,0.4);
            transition: all 0.3s; margin: 5px;
        }
        .btn:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(255,107,157,0.6); }
        .gallery-preview {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px; margin-top: 30px;
        }
        .gallery-item {
            background: white; border-radius: 15px; padding: 15px;
            text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        .status {
            padding: 20px; border-radius: 15px; margin: 20px 0;
            font-weight: 600; text-align: center; display: none;
        }
        .status.success { background: #d4edda; color: #155724; border: 2px solid #c3e6cb; }
        .status.error { background: #f8d7da; color: #721c24; border: 2px solid #f5c6cb; }
        @media (max-width: 768px) {
            .header h1 { font-size: 2em; }
            .content { padding: 20px; }
        }
    </style>
<script defer src="https://derev-studio.github.io/photo-gallery/analytics-client.js"></script>
<script defer src="https://derev-studio.github.io/photo-gallery/counter.js" data-site="dasha-risunki"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌸 Админка Даши</h1>
            <p>Управляй товарами легко! ⛰️ Фудзияма + сакура</p>
        </div>
        <div class="content">
            <div class="form-section">
                <h2 style="color: #c44569; margin-bottom: 25px;">➕ Добавить товар</h2>
                <form id="productForm">
                    <div class="form-group">
                        <label>Название:</label>
                        <input type="text" id="title" placeholder="Розовое платье" required>
                    </div>
                    <div class="form-group">
                        <label>Описание:</label>
                        <textarea id="description" placeholder="Описание товара..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Цена (₽):</label>
                        <input type="number" id="price" placeholder="1000" min="0" required>
                    </div>
                    <div class="form-group">
                        <label>Ссылка на картинку:</label>
                        <input type="url" id="imageUrl" placeholder="https://example.com/image.jpg">
                        <small>Оставь пустым = случайная картинка Даши</small>
                    </div>
                    <div style="text-align: center;">
                        <button type="submit" class="btn">💖 СОХРАНИТЬ</button>
                        <button type="button" class="btn" onclick="loadGallery()" style="background: linear-gradient(45deg, #6b7280, #4b5563);">🔄 Обновить</button>
                    </div>
                </form>
                <div id="status" class="status"></div>
            </div>

            <div class="form-section">
                <h2 style="color: #c44569; margin-bottom: 25px;">👀 Галерея</h2>
                <div id="galleryPreview" class="gallery-preview"></div>
            </div>
        </div>
    </div>

    <script>
        let gallery = [];

        function loadGallery() {
            fetch('/gallery.json')
                .then(res => res.ok ? res.json() : Promise.reject())
                .then(data => {
                    gallery = data;
                    displayGallery();
                    showStatus(`✅ Загружено ${gallery.length} товаров!`, 'success');
                })
                .catch(() => {
                    gallery = [
                        {title: "Картина Даши #1", description: "Акварель с сакурой", price: 1500, image: "https://via.placeholder.com/300/ff69b4/fff?text=Дашa+1"},
                        {title: "Картина Даши #2", description: "Масло Фудзияма", price: 2500, image: "https://via.placeholder.com/300/ff1493/fff?text=Дашa+2"},
                        {title: "Картина Даши #3", description: "Акрил вечер", price: 3500, image: "https://via.placeholder.com/300/c71585/fff?text=Дашa+3"}
                    ];
                    displayGallery();
                    showStatus('🎨 Показаны картины Даши', 'success');
                });
        }

        function displayGallery() {
            const container = document.getElementById('galleryPreview');
            container.innerHTML = '';
            gallery.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'gallery-item';
                div.innerHTML = `
                    <img src="${item.image}" alt="${item.title}" style="width:100%;height:150px;object-fit:cover;border-radius:10px;">
                    <h4>${item.title}</h4>
                    <p>${item.description}</p>
                    <strong>${item.price}₽</strong>
                `;
                container.appendChild(div);
            });
        }

        function showStatus(msg, type) {
            const status = document.getElementById('status');
            status.textContent = msg;
            status.className = `status ${type}`;
            status.style.display = 'block';
            setTimeout(() => status.style.display = 'none', 3000);
        }

        document.getElementById('productForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const newProduct = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                price: parseFloat(document.getElementById('price').value),
                image: document.getElementById('imageUrl').value || gallery[0]?.image || 'https://via.placeholder.com/300/ff69b4/fff?text=Новая'
            };
            gallery.unshift(newProduct);
            localStorage.setItem('dashaGallery', JSON.stringify(gallery));
            document.getElementById('productForm').reset();
            displayGallery();
            showStatus('✅ Товар добавлен!', 'success');
        });

        loadGallery();
    </script>
</body>
</html>
